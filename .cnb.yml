# CNB pipeline configuration for kimicode.all/kimicode.
#
# This file tunes the NPC task that runs when `@CodeBuddy ...` is mentioned in
# an issue or pull request. It is written against the platform's NPC merge
# contract (https://docs.cnb.cool/zh/build/npc.md), which this repository got
# wrong once already: the previous revision wrapped everything in a `default:`
# key and set `timeout:` at the pipeline level. Both are rejected by the
# pipeline schema, and a rejected event block does not fail the build — CNB
# silently falls back to the platform default, so the whole tuning never ran.
# The evidence, measured inside the NPC container on `cnb-91b-1k37mvioj`:
#
#   CNB_BUILD_JOB_NAME=npc go      (the `prepare toolchain` stage did not run)
#   CNB_CPUS=8 / CNB_MEMORY=16     (runner.cpus: 16 was ignored)
#   rg --version  -> ripgrep 13.0.0, and /usr/local/bin/rg absent
#   git config --get commit.gpgsign -> true
#
# Shape rules that matter here:
#   * An event holds either an array of pipelines, or an object whose values are
#     pipelines. `default:` is neither — it is not a pipeline field.
#   * A pipeline has no `timeout`. `timeout` belongs to a job (the stage entry
#     itself, for a script job), in milliseconds.
#   * `npc:go` must be the pipeline's job; the preparation is a sibling script
#     job that runs before it in the same stage list.
#
# Why the preparation exists at all — two defects in `cnbcool/default-npc:latest`
# that break `cargo test --features cli --lib` in packages/kimi-agent:
#
#   1. `/root/.gitconfig` sets `commit.gpgsign=true` with a `gpg.program` that
#      cannot sign in this container, so every `git commit` in a temporary test
#      repository dies with "gpg failed to sign the data". The tower and
#      mode-mutex tests commit into temp repos and fail on it.
#   2. The image ships ripgrep 13.0.0, while src/tools/grep_types.rs transcribes
#      the ripgrep 15.0.0 table and reconciles against the local `rg`.
#
# With both worked around, the suite is green. Reference:
#   https://docs.cnb.cool/zh/build/npc.html        (event merge semantics)
#   https://docs.cnb.cool/zh/build/grammar.html    (pipeline / job fields)
#   https://docs.cnb.cool/zh/build/build-node.html (runner.cpus => memory)

# Shared NPC event configuration, reused by both NPC events via a YAML anchor.
# `include` cannot be used for this: the merged config is per-event, and anchors
# do not cross files.
.npc-event: &npc-event
  # Each value under the event is one pipeline; the key is only its name.
  npc:
    runner:
      # 16 cpus => 32 GiB of memory (the default is 8 cpus => 16 GiB).
      cpus: 16
    docker:
      image: cnbcool/default-npc:latest
    env:
      # Keep the compiler's memory peak bounded: rustc defaults to one codegen
      # unit per core, and this crate's rquickjs/rusqlite C sources make the
      # cold build the peak of the run.
      CARGO_BUILD_JOBS: '8'
      RUSTFLAGS: '-C codegen-units=1'
    stages:
      - name: prepare toolchain
        # A stage is also a job when it carries `script`, and `timeout` is a job
        # field (milliseconds). The platform default is 10 minutes with no
        # output, which a cold Rust build can exceed while downloading crates.
        timeout: 3600000
        script: |
          set -e
          # The image ships ripgrep 13.0.0, but the file-type table in
          # packages/kimi-agent/src/tools/grep_types.rs is transcribed from
          # ripgrep 15.0.0. Install the matching version so the reconciliation
          # test compares like with like instead of reporting 73 mismatches.
          if ! rg --version 2>/dev/null | grep -q '^ripgrep 15\.'; then
            curl -fsSL -o /tmp/rg.tar.gz \
              https://github.com/BurntSushi/ripgrep/releases/download/15.0.0/ripgrep-15.0.0-x86_64-unknown-linux-musl.tar.gz
            tar -xzf /tmp/rg.tar.gz -C /tmp
            install -m 0755 \
              /tmp/ripgrep-15.0.0-x86_64-unknown-linux-musl/rg /usr/local/bin/rg
          fi
          rg --version | head -1
          # The platform sets commit.gpgsign=true in /root/.gitconfig, but the
          # configured signer cannot sign here, which breaks every `git commit`
          # made by tests in a temporary repository. Disable it at the
          # repository level for the duration of this build.
          git config --local commit.gpgsign false
          echo "gpg signing disabled for this build"
      - name: npc go
        type: npc:go

$:
  # Issue comments: `@CodeBuddy ...` in an issue description or comment.
  issue.comment@npc: *npc-event

  # Pull request comments: same event semantics, configured independently.
  # CNB merges NPC config per event, so this must be repeated or PR comments
  # fall back to the platform defaults.
  pull_request.comment@npc: *npc-event

# ---------------------------------------------------------------------------
# Cross-platform mirroring to GitHub (tencentcom/git-sync).
#
# The repository is deliberately two-legged: this side owns `.cnb.yml` (the
# NPC tuning above), while the GitHub side owns `.github/workflows/` (the
# upstream workflows merged from MoonshotAI/kimi-code). Neither side is a
# mirror of the other, so the sync must never overwrite the target's files.
# That is why `sync_mode: rebase` is used instead of the plugin's default
# `push` — rebase replays this branch's commits on top of the target's, so
# `.github/workflows/` survives on GitHub while `.cnb.yml` survives here.
#
# Credentials (GIT_USERNAME / GIT_ACCESS_TOKEN) live in the secret repository
# `kimicode.all/key`, file `github-sync.yml`, and are injected through
# `imports`. The secret file declares:
#   allow_slugs:    [kimicode.all/kimicode]
#   allow_events:   [push]
#   allow_branches: [main]
# `allow_branches` gates the *triggering* branch (CNB_BRANCH), not the branches
# being mirrored, so it still matches the `main` trigger below even though the
# job now mirrors every branch.
#
# Scope: this job mirrors *all* branches and all tags, not just `main`.
# `branch` is deliberately left unset — the plugin's `git push target --all`
# path — and `push_tags: true` adds `--tags`. Note that rebase mode always
# force-pushes, so every mirrored branch is rewritten on GitHub to carry this
# side's commits on top of GitHub's. Branches that exist only on GitHub are
# left alone.
#
# Reference: https://cnb.cool/cnb/plugins/market/-/tree/main/plugins/tencentcom/git-sync
#            https://docs.cnb.cool/zh/build/file-reference.md (imports auth)

# The mirror job, kept as an anchor-free sibling of the NPC config so that the
# two never interfere: NPC config is merged per event, and this is a distinct
# event (`push`) on a distinct branch key (`main`).
main:
  push:
    - name: sync to github
      imports:
        - https://cnb.cool/kimicode.all/key/-/blob/main/github-sync.yml
      stages:
        - name: mirror all branches to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/7723qqq/kimi-code.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            # No `branch`: the plugin then pushes every branch
            # (`git push target --all`) instead of a single one.
            push_tags: true
            # Preserve GitHub-side files (`.github/workflows/`) instead of
            # clobbering them with this side's tree.
            sync_mode: rebase
