# CNB pipeline configuration for kimicode.all/kimicode.
#
# This file tunes the NPC tasks that run when `@CodeBuddy ...` is mentioned in
# an issue or pull request. Without it, this repository gets the platform
# defaults (8 CPUs / 16 GiB, `cnbcool/default-npc:latest`), which produced two
# distinct classes of failure:
#
# 1. `cargo test --features cli --lib` in packages/kimi-agent failed 10 tests.
#    Reproduced locally and traced to two environment defects in the default
#    NPC image, not to repository code:
#      - `commit.gpgsign=true` is set in /root/.gitconfig, but the configured
#        `gpg.program` cannot sign in this container, so every `git commit`
#        inside a test repo fails with "gpg failed to sign the data". Nine
#        tower tests commit to a temporary repo and die on this.
#      - The image ships ripgrep 13.0.0, while src/tools/grep_types.rs is
#        transcribed from ripgrep 15.0.0. The table-reconciliation test then
#        reports "73 of 217 types disagree".
#    With both defects worked around, the suite goes 2810 passed / 0 failed.
#
# 2. Long Rust builds risk the default 10-minute no-output timeout. The NPC
#    agent installs the Rust toolchain from scratch on every run (the image has
#    no cargo/rustc/gcc), which alone costs ~30-50s before compiling.
#
# The `prepare toolchain` stage below fixes both at the source of the run.
# `runner.cpus` is raised because memory on CNB is bound to CPU count
# (memory = cpus x 2 GiB), giving the Rust build headroom.
#
# Reference: https://docs.cnb.cool/zh/build/npc.html (NPC config merge)
#            https://docs.cnb.cool/zh/build/build-node.html (runner.cpus)
#            https://docs.cnb.cool/zh/build/timeout.html (job timeout)

# Shared NPC event configuration, reused by both NPC events via a YAML anchor.
# `include` cannot be used for this: the merged config is per-event, and
# anchors do not cross files.
.npc-event: &npc-event
  default:
    runner:
      # 16 cpus => 32 GiB of memory (the default is 8 cpus => 16 GiB).
      cpus: 16
    # Applies to every tool execution of the NPC agent (e.g. a single
    # `cargo test`) and doubles as the no-output timeout. The default is 10
    # minutes, which a cold Rust build can exceed while downloading crates.
    timeout: 60m
    docker:
      image: cnbcool/default-npc:latest
    env:
      # Keep the compiler's memory peak bounded: rustc defaults to one codegen
      # unit per core, and this crate's rquickjs/rusqlite C sources make the
      # cold build the peak of the run.
      CARGO_BUILD_JOBS: '8'
      RUSTFLAGS: '-C codegen-units=1'
    stages:
      - name: prepare toolchain
        script: |
          set -e
          # The image ships ripgrep 13.0.0, but the file-type table in
          # packages/kimi-agent/src/tools/grep_types.rs is transcribed from
          # ripgrep 15.0.0. Install the matching version so the reconciliation
          # test passes instead of reporting 73 mismatches.
          if ! rg --version 2>/dev/null | grep -q '^ripgrep 15\.'; then
            curl -fsSL -o /tmp/rg.tar.gz \
              https://github.com/BurntSushi/ripgrep/releases/download/15.0.0/ripgrep-15.0.0-x86_64-unknown-linux-musl.tar.gz
            tar -xzf /tmp/rg.tar.gz -C /tmp
            install -m 0755 \
              /tmp/ripgrep-15.0.0-x86_64-unknown-linux-musl/rg /usr/local/bin/rg
          fi
          rg --version | head -1
          # The platform sets commit.gpgsign=true in /root/.gitconfig, but the
          # configured signer cannot sign here, which breaks every `git commit`
          # made by tests in a temporary repository. Disable it at the
          # repository level for the duration of this build.
          git config --local commit.gpgsign false
          echo "gpg signing disabled for this build"
      - name: npc go
        type: npc:go

$:
  # Issue comments: `@CodeBuddy ...` in an issue description or comment.
  issue.comment@npc: *npc-event

  # Pull request comments: same event semantics, configured independently.
  # CNB merges NPC config per event, so this must be repeated or PR comments
  # fall back to the platform defaults.
  pull_request.comment@npc: *npc-event
