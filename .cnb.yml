# CNB pipeline configuration for kimicode.all/kimicode.
#
# Two independent things live here:
#   1. the NPC task that runs when `@CodeBuddy ...` is mentioned in an issue or
#      pull request (the `$` block),
#   2. the cross-platform mirror to GitHub (the `main` block).
#
# They are separate: NPC config is merged per event, and the mirror is a
# `push` event on a specific branch, so the two never interact.
#
# ---------------------------------------------------------------------------
# 1. NPC task
# ---------------------------------------------------------------------------
#
# Background, because this file has been wrong twice and silently so.
#
# The previous revision wrapped its pipeline in a `default:` key and set
# `timeout:` at the pipeline level. Both are rejected by the platform's own
# pipeline schema, and a rejected NPC event does NOT fail the build — CNB
# falls back to its own defaults and says nothing. So the tuning appeared
# merged while never running. Measured inside the NPC container on that
# revision:
#
#   CNB_BUILD_JOB_NAME=npc go     the `prepare toolchain` stage never ran
#   CNB_CPUS=8 / CNB_MEMORY=16    `runner.cpus: 16` was ignored
#   rg --version -> ripgrep 13.0.0
#   git config --get commit.gpgsign -> true
#
# Shape rules that keep it valid (schema: https://docs.cnb.cool/zh/build/grammar.md):
#   * An event holds an array of pipelines, or an object whose *values* are
#     pipelines. `default:` is neither — it has no meaning as a pipeline field.
#   * A pipeline has no `timeout`. `timeout` is a job field, in ms/s/m/h.
#   * `npc:go` is the job that runs the agent.
#
# Why the environment is now a custom image instead of an inline prep stage:
#
# The `prepare toolchain` script job that used to sit here has been replaced by
# `.cnb/npc.Dockerfile`, built and pushed by the `npc image` pipeline below and
# consumed through `docker.image`. Two reasons, one of which is a correction.
#
#   1. (corrected) The old stage's stated purpose was to work around
#      `commit.gpgsign=true` in `/root/.gitconfig` breaking `git commit` in
#      temporary test repositories. That does not reproduce. Measured inside
#      `npc:go` on 2026-09-24, with the same `/root/.gitconfig` in place:
#
#        $ cd /tmp/t && git init -q . && echo x > f && git add f
#        $ git commit -qm x ; echo exit=$?
#        exit=0
#
#      `cnb-gpgsign` is present at /usr/local/bin/cnb-gpgsign and signs fine.
#      The stage's `git config --local commit.gpgsign false` ran in the
#      pipeline's own checkout, which is not where the tests commit anyway —
#      they commit into fresh `git init` repos under the temporary directory,
#      and `--local` in the checkout never reached them. The ten tower-test
#      failures in the original report came from something else, and the fix
#      for them is not a signing toggle. This is deliberately *not* carried
#      over: a workaround for a cause that does not hold would hide the real
#      one the next time those tests fail.
#
#   2. (real, still true) The default image ships ripgrep 13.0.0 (169 file
#      types) while `packages/kimi-agent/src/tools/grep_types.rs` transcribes
#      the ripgrep 15.0.0 table (217 file types), so the reconciliation test
#      reports "73 of 217 types disagree". And the image has no Rust
#      toolchain, so every run installs cargo/rustc/gcc from scratch and then
#      pays a cold build — whose long silent stretches are what actually
#      aborted `cnb-91b-1k37mvioj` (the agent's own `cargo test ... | tail -12`
#      produced no output for 10 minutes and hit the no-output timeout).
#
# Doing this in an image rather than in a stage is what makes it correct: the
# toolchain is present before the agent starts, `timeout` below then applies to
# each of the agent's tool calls rather than to a one-shot prep job, and the
# ripgrep version stops depending on a network fetch succeeding mid-run.
#
# Reference: https://docs.cnb.cool/zh/build/npc.md (自定义运行环境)
#            https://docs.cnb.cool/zh/build/timeout.md (job timeout semantics)

# Shared NPC event configuration, reused by both NPC events via a YAML anchor.
# `include` cannot be used for this: the merged config is per-event, and anchors
# do not cross files.
.npc-event: &npc-event
  # Each value under the event is one pipeline; the key is only its name.
  npc:
    runner:
      # 16 cpus => 32 GiB of memory (the default is 8 cpus => 16 GiB).
      cpus: 16
    docker:
      # Built and pushed by the `npc image` pipeline below, from `.cnb/npc.Dockerfile`.
      # `CNB_REPO_SLUG_LOWERCASE` is `kimicode.all/kimicode`, so this resolves to
      # `docker.cnb.cool/kimicode.all/kimicode/npc:latest`.
      image: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/npc:latest
    env:
      # Keep the compiler's memory peak bounded: rustc defaults to one codegen
      # unit per core, and this crate's rquickjs/rusqlite C sources make the
      # cold build the peak of the run.
      CARGO_BUILD_JOBS: '8'
      RUSTFLAGS: '-C codegen-units=1'
    stages:
      - name: npc go
        type: npc:go
        # `timeout` is a job field and, for `npc:go`, applies to each of the
        # agent's tool executions rather than to the session as a whole: a
        # single call with no output for this long is killed. The default is
        # 10 minutes, which `cargo test` over this crate exceeds. 45 minutes
        # leaves room for a cold build plus the suite without letting a stuck
        # call sit until the 2-hour job cap.
        timeout: 45m

$:
  # Issue comments: `@CodeBuddy ...` in an issue description or comment.
  issue.comment@npc: *npc-event

  # Pull request comments: same event semantics, configured independently.
  # CNB merges NPC config per event, so this must be repeated or PR comments
  # fall back to the platform defaults.
  pull_request.comment@npc: *npc-event

# ---------------------------------------------------------------------------
# 2. NPC image
# ---------------------------------------------------------------------------
#
# Rebuilds on every push to `main` that touches the Dockerfile or this file.
# `ifModify` keeps the Docker build off unrelated pushes; the Docker layer
# cache means the expensive Rust/ripgrep layers are only redone when their
# inputs change.
#
# The tag is `:latest`, and the NPC pipeline reads it by tag — so the image must
# exist before the next `@CodeBuddy`. `ifModify` therefore includes `.cnb.yml`:
# a change to the NPC pipeline is a change that needs the image rebuilt.
main:
  push:
    - name: npc image
      ifModify:
        - .cnb/npc.Dockerfile
        - .cnb.yml
      services:
        - docker
      stages:
        - name: docker login
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: docker build
          script: |
            set -e
            IMAGE=${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/npc
            docker build -f .cnb/npc.Dockerfile -t "${IMAGE}:latest" -t "${IMAGE}:${CNB_COMMIT_SHORT}" .
            echo "IMAGE=${IMAGE}:latest" >> "$CNB_EXPORTS"
        - name: docker push
          script: |
            set -e
            docker push "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/npc:latest"
            docker push "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/npc:${CNB_COMMIT_SHORT}"
        - name: smoke test
          script: |
            set -e
            IMAGE=${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/npc:${CNB_COMMIT_SHORT}
            # Assert the three things the image exists to guarantee, so a
            # regression fails the push instead of surfacing as an NPC run
            # that mysteriously fails an hour later.
            docker run --rm "$IMAGE" sh -eu -c '
              rg --version | grep -q "^ripgrep 15\." || { echo "rg is not 15.x: $(rg --version | head -1)"; exit 1; }
              rg --type-list | wc -l | grep -qx "217" || { echo "rg file-type count is $(rg --type-list | wc -l), expected 217"; exit 1; }
              cargo --version >/dev/null || { echo "cargo missing"; exit 1; }
              rustc --version >/dev/null || { echo "rustc missing"; exit 1; }
              cc --version >/dev/null || { echo "no C compiler"; exit 1; }
              echo "smoke test ok: $(rg --version | head -1), $(cargo --version)"
            '

    # The mirror job, kept as an anchor-free sibling of the NPC config so that the
    # two never interfere: NPC config is merged per event, and this is a distinct
    # event (`push`) on a distinct branch key (`main`).
    - name: sync to github
      imports:
        - https://cnb.cool/kimicode.all/key/-/blob/main/github-sync.yml
      stages:
        - name: mirror all branches to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/7723qqq/kimi-code.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            # No `branch`: the plugin then pushes every branch
            # (`git push target --all`) instead of a single one.
            push_tags: true
            # Preserve GitHub-side files (`.github/workflows/`) instead of
            # clobbering them with this side's tree.
            sync_mode: rebase
