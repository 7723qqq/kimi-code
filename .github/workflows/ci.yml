name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Smoke test CLI bundle
        run: cd apps/kimi-code && bun run smoke

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      - name: Install Rust toolchain (kimi-native-tools)
        uses: dtolnay/rust-toolchain@stable

      - name: Build kimi-native-tools
        run: cd packages/kimi-native-tools && bun run build

      # The vitest suite runs under the Bun runtime (`--bun`): Bun is the
      # canonical dev/test toolchain and the shards need no Node install.
      - run: bun --bun run test --shard=${{ matrix.shard }}/5

  # pi-tui's suite runs on node:test (not vitest), so the root `bun run test`
  # does not execute it; it needs its own job.
  test-pi-tui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - run: cd packages/pi-tui && bun --bun run test

  # minidb is excluded from the root vitest projects: its process-spawning
  # e2e tests need a 30s timeout and would slow the sharded suite. Without a
  # job of its own its tests never run.
  test-minidb:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - run: cd packages/minidb && bun --bun run test

  # apps/kimi-web is excluded from the root Bun workspace (standalone install
  # via its own bun.lock), so the root suite never sees it.
  test-kimi-web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-kimi-web-${{ hashFiles('apps/kimi-web/bun.lock') }}

      - run: cd apps/kimi-web && bun install --frozen-lockfile
      - run: cd apps/kimi-web && bun --bun run typecheck
      - run: cd apps/kimi-web && bun --bun run test
      - run: cd apps/kimi-web && bun --bun run check:style

  test-windows:
    runs-on: windows-latest
    # Temporarily disabled while Windows tests are being stabilized.
    if: false

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # Same Bun-runtime note as the sharded test job.
      - run: bun install --frozen-lockfile
      # Windows runners are slower and run the whole suite (including
      # in-process e2e tests) under more contention, so the default 5s test
      # timeout causes flaky failures. Give it more headroom.
      - run: bun --bun run test -- --testTimeout=30000

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - run: bun --bun run lint
      - run: bun --bun run sherif
      # Engine boundaries: cross-package deep imports, then the intra-package
      # layering check. Both are cheap reads of the source tree that the type
      # checker does not cover.
      - run: bun --bun run check:deep-imports
      - run: bun --bun run check:boundaries
      # Comment-free zones: agent-core-v2, kap-server and transcript carry no
      # comments at all (DEVELOP.md, "General Coding Rules").
      - run: bun scripts/check-no-comments.mjs
      # Locale consistency: en/zh key parity, placeholder validity, call-site
      # coverage, and JSON freshness (regenerate, then fail if tracked JSON
      # drifted from the TS sources).
      - run: bun scripts/check-locale-keys.mjs
      - run: bun scripts/check-locale-placeholders.cjs
      - run: bun scripts/check-t-call-coverage.mjs
      - run: bun scripts/generate-locale-json.cjs && git diff --exit-code -- '**/locales/*.json'

  # Structural review (tools/review): a Zig program that reads the repository
  # itself rather than running the test suite. It cross-checks documentation
  # against the scripts and CI jobs that actually run, finds workspace members
  # whose tests never run, catches generated files that drifted from their
  # source, and flags exported functions only their own test calls.
  review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build the review tool
        run: cd tools/review && zig build

      - name: Run the review checks
        run: ./tools/review/zig-out/bin/review

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: |
          bunx --bun --package @typescript/native-preview@beta tsgo --version
          for config in packages/*/tsconfig.json apps/kimi-code/tsconfig.json apps/kimi-inspect/tsconfig.json; do
            echo "Typechecking ${config}"
            bunx --bun --package @typescript/native-preview@beta tsgo -p "${config}" --noEmit
          done
      - name: Typecheck VS Code extension
        run: cd apps/vscode && bun --bun run typecheck
      - name: Typecheck vis-server
        run: cd apps/vis/server && bun --bun run typecheck
      - name: Typecheck vis-web
        run: cd apps/vis/web && bun --bun run typecheck
