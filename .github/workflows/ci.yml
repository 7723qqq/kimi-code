name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/*'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ startsWith(github.ref, 'refs/heads/release/') && github.sha || '' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  release-workflow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun test --timeout 30000 ./scripts/release-trigger.test.mjs

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Smoke test CLI bundle
        run: cd apps/kimi-code && bun run smoke

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      # Every package suite runs through the per-file runner
      # (scripts/run-package-tests.mjs), reached via the root
      # `bun run test` (scripts/run-tests.mjs). The runner gives each test
      # file its own wall-clock bound, so a file that never finishes is
      # reported as a hang with its name instead of stalling the shard.
      # `--shard=N/M` is forwarded to it; shards are assigned by file
      # position, so no file runs twice and none is left out.
      - run: bun run test --shard=${{ matrix.shard }}/5

  # pi-tui, minidb and the remaining packages all run through the root
  # `bun run test` (scripts/run-tests.mjs), which invokes each package's own
  # `bun test` inside that package so its bunfig preload/ignores still apply.

  # The heavy set is the work that needs real processes, real sockets or real
  # git: minidb's `test/e2e/**` and `test/cluster/**`, and the `*.e2e.test.ts`
  # files of agent-core-v2, apps/kimi-code, kap-server and acp-server. Each
  # package's bunfig excludes them via `pathIgnorePatterns`, so the sharded job
  # above never sees them — without this job they would simply never run.
  test-heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      # Sets KIMI_TEST_HEAVY=1 and KIMI_E2E=1, then runs the same per-package
      # runner with `--include-heavy`. Nothing is duplicated from the default
      # suite: the default run still executes every non-heavy file.
      - run: bun run test:heavy

  test-windows:
    runs-on: windows-latest
    # Temporarily disabled while Windows tests are being stabilized.
    if: false

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # Same Bun-runtime note as the sharded test job.
      - run: bun install --frozen-lockfile
      - run: bun run test --timeout=30000

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - run: bun --bun run lint
      - run: bun --bun run sherif
      # Engine boundaries: cross-package deep imports, then the intra-package
      # layering check. Both are cheap reads of the source tree that the type
      # checker does not cover.
      - run: bun --bun run check:deep-imports
      - run: bun --bun run check:boundaries
      # Comment-free zones: agent-core-v2, kap-server and transcript carry no
      # new comments (DEVELOP.md, "General Coding Rules"). Reviewed existing
      # ones are counted in scripts/no-comments-baseline.txt.
      - run: bun --bun run check:no-comments
      # Test-runner residue: the vitest→`bun test` migration is only durable if
      # a stray `from 'vitest'`, `vi.fn()` or `{ skip: true }` fails the build
      # instead of silently passing. The scanner reads the source tree only; the
      # baseline it reads holds the reviewed exceptions (comment-only notes and
      # fixtures that run outside bun test), each with its reason.
      - run: bun run scan:residue
      # Locale consistency: en/zh key parity, placeholder validity, call-site
      # coverage. The `.ts` sources under `*/locales/` are the single source of
      # truth — the engine receives locale data as an in-memory JSON string.
      - run: bun scripts/check-locale-keys.mjs
      - run: bun --bun run check:locale-placeholders
      - run: bun scripts/check-t-call-coverage.mjs
      # Status surface: the strip above the editor is where a user reads while
      # waiting, so its text must go through t(). The two checks above cannot
      # see a literal that never called t() at all — this one walks that code.
      - run: bun --bun run check:status-surface-i18n
      # Every UI tree: the same blind spot as above, one level up. Prose
      # literals outside t() are counted in scripts/no-hardcoded-prose-baseline.txt
      # (shrink-only); a new hardcoded string fails the run.
      - run: bun --bun run check:no-hardcoded-prose
      # Request-boundary strictness: a route body schema without `.strict()`
      # drops an unrecognized key and still answers `code: 0`, so a client's
      # typo is indistinguishable from a successful write.
      - run: bun tools/review/check-strict-request-bodies.mjs
      # Workspace catalog: a dependency the catalog already declares must be
      # written as `catalog:` in the package, not as a repeated range — the
      # next bump otherwise has to be made in two places, and the one that is
      # missed is the one that ships.
      - run: bun tools/review/check-catalog-versions.mjs
      # Service naming: domain directories and service files under
      # packages/kap-server/src/services stay camelCase (the second root this
      # script once covered, packages/services/src, no longer exists).
      - run: bun scripts/check-service-naming.mjs

  # Structural review (tools/review): a Zig program that reads the repository
  # itself rather than running the test suite. It cross-checks documentation
  # against the scripts and CI jobs that actually run, finds workspace members
  # whose tests never run, catches generated files that drifted from their
  # source, and flags exported functions only their own test calls.
  review:
    runs-on: ubuntu-latest

    steps:
      # `fetch-depth: 0` matters twice over: the drift check needs the full
      # history of BOTH sides to compute a merge base, and it needs the
      # `upstream` remote at all. Without them the ref is absent, the check
      # degrades to an `info` line, and a file dropped during a merge cannot
      # fail the build on any pull request. A shallow fetch would leave no
      # common ancestor, which the check reports as "skipped" rather than
      # "clean" — so keep the depth on.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream for the drift check
        run: |
          git remote add upstream https://github.com/MoonshotAI/kimi-code.git
          git fetch --no-tags upstream main
        continue-on-error: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build the review tool
        run: cd tools/review && zig build

      # `zig build` compiles; only `zig build test` runs the tool's own 91 unit
      # tests. DEVELOP.md tells contributors to add a new check's module to the
      # `test` block "or its tests will not run" — that promise needs a job that
      # actually invokes it.
      - name: Test the review tool
        run: cd tools/review && zig build test

      - name: Run the review checks
        run: ./tools/review/zig-out/bin/review

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: |
          bunx --bun --package @typescript/native-preview@beta tsgo --version
          for config in packages/*/tsconfig.json apps/kimi-code/tsconfig.json apps/kimi-inspect/tsconfig.json; do
            echo "Typechecking ${config}"
            bunx --bun --package @typescript/native-preview@beta tsgo -p "${config}" --noEmit
          done
      - name: Typecheck VS Code extension
        run: cd apps/vscode && bun --bun run typecheck
      - name: Typecheck vis-server
        run: cd apps/vis/server && bun --bun run typecheck
      - name: Typecheck vis-web
        run: cd apps/vis/web && bun --bun run typecheck

