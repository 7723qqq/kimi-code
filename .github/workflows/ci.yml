name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Smoke test CLI bundle
        run: cd apps/kimi-code && bun run smoke

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry
            ~/.cargo/git
            packages/kimi-agent/target
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}-cargo-${{ hashFiles('packages/kimi-agent/Cargo.lock') }}

      - run: bun install --frozen-lockfile

      - name: Install Rust toolchain (kimi-agent)
        uses: dtolnay/rust-toolchain@stable

      - name: Build kimi-agent native addon
        run: cd packages/kimi-agent && bun run build

      # No vitest suite spawns the CLI binary directly anymore; the step is
      # kept so the stdio transport stays built on every PR.
      #
      # `--no-default-features` drops the `napi` feature: the addon's symbols
      # are provided by the Node/Bun host that dlopens the cdylib, so a
      # standalone binary has nothing to resolve them against and the Linux
      # link fails. The CLI never calls into the addon.
      - name: Build kimi-agent CLI binary (debug)
        working-directory: packages/kimi-agent
        run: cargo build --no-default-features --features cli,workflow-js --bin kimi-agent-cli

      # The vitest suite runs under the Bun runtime (`--bun`): Bun is the
      # canonical dev/test toolchain and the shards need no Node install.
      - run: bun --bun run test --shard=${{ matrix.shard }}/5

  # The Rust engine has its own cargo suite (unit tests plus the stdio-RPC
  # integration tests). It is not part of the vitest workspace, so without this
  # job nothing in CI ever runs it.
  #
  # Windows stays in the matrix on purpose: the native-Bash path shells out to
  # Git Bash and is Windows-sensitive, and the deadlock this job was written to
  # catch (a child inheriting the engine's RPC stdin) only reproduced there.
  test-rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/kimi-agent/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/kimi-agent/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # Quality gates run once (on ubuntu) before either test suite: plain
      # rustfmt plus clippy with warnings denied for the Rust package.
      - name: Check formatting (kimi-agent)
        if: matrix.os == 'ubuntu-latest'
        working-directory: packages/kimi-agent
        run: cargo fmt --check

      - name: Clippy (kimi-agent)
        if: matrix.os == 'ubuntu-latest'
        working-directory: packages/kimi-agent
        run: cargo clippy --all-targets --features cli -- -D warnings

      # `--features cli` is what builds the `kimi-agent-cli` binary the
      # integration tests spawn. It sits behind `required-features`, so a bare
      # `cargo test` leaves a stale artifact in place — or none at all.
      #
      # `--no-default-features` drops `napi` for the same reason as the CLI
      # build in the `test` job: the test harnesses link the lib, and the
      # addon's symbols only exist inside a Node/Bun host.
      - name: Build the CLI binary the integration tests spawn
        working-directory: packages/kimi-agent
        run: cargo build --no-default-features --features cli,workflow-js --bin kimi-agent-cli

      - name: Test Rust engine
        working-directory: packages/kimi-agent
        run: cargo test --no-default-features --features cli,workflow-js

      # The integration tests skip — and therefore pass — when that binary is
      # missing, which would turn this job green while it tested nothing.
      - name: Assert the CLI binary was built
        working-directory: packages/kimi-agent
        shell: bash
        run: |
          if [ ! -f target/debug/kimi-agent-cli ] && [ ! -f target/debug/kimi-agent-cli.exe ]; then
            echo "::error::kimi-agent-cli missing; integration tests would silently skip"
            exit 1
          fi

  # pi-tui's suite runs on node:test (not vitest), so the root `bun run test`
  # does not execute it; it needs its own job.
  test-pi-tui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - run: cd packages/pi-tui && bun --bun run test

  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry
            ~/.cargo/git
            packages/kimi-agent/target
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}-cargo-${{ hashFiles('packages/kimi-agent/Cargo.lock') }}

      # Same Bun-runtime note as the sharded test job.
      - run: bun install --frozen-lockfile

      - name: Install Rust toolchain (kimi-agent)
        uses: dtolnay/rust-toolchain@stable

      # The suite exercises the engine through the napi addon; without this
      # build the native-backed tests fail on a fresh checkout.
      - name: Build kimi-agent native addon
        run: cd packages/kimi-agent && bun run build

      # Windows runners are slower and run the whole suite (including
      # in-process e2e tests) under more contention, so the default 5s test
      # timeout causes flaky failures. Give it more headroom.
      - run: bun --bun run test -- --testTimeout=30000

  lint:
    runs-on: ubuntu-latest

    steps:
      # Full history: the retired-package delta ratchet below needs the merge
      # base with upstream/main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - run: bun --bun run lint
      - run: bun --bun run sherif
      # flake.nix hardcodes a workspacePaths list that must track the root
      # package.json `workspaces` globs. A path missing there is silently dropped
      # from the Nix build's src fileset, so the mismatch has to fail here.
      - run: bun run check:nix-workspace
      # Terminal-state gate (ROADMAP P161): no retired engine package
      # (agent-core-v2 / kimi-native-tools / klient / acp-server) may be
      # referenced from manifests, imports, tsconfigs, flake.nix, or CI.
      - run: bun scripts/check-no-legacy-engine.mjs
      # Architecture gate (architecture.json): module sources exist, every
      # declared dep resolves, no module imports a workspace package it did not
      # declare, layer order and acyclicity hold, and every fingerprinted module
      # still matches its source. Fail-closed, and it was pre-commit-only until
      # now — a gate nothing runs in CI is a gate nobody notices failing.
      #
      # A source change under a fingerprinted module makes this fail until the
      # same commit refreshes the stored hash:
      #   bun run check:architecture:update
      # CI cannot do that itself: writing the model here would hide the very
      # drift the step exists to report.
      - run: bun scripts/check-architecture-drift.mjs
      # Normify structure-data gate (normify-kimi-code/): the second architecture
      # registry, and the one the rendered diagram is generated from. It carries the
      # same evidence rule as the gate above — every module's stored fingerprint must
      # still match its declared source files — plus L2 structural checks (leaf /
      # api / edge / layout / file-mapping) and the policy.yml rule set.
      #
      # It was CI-blind until now: 12 modules had drifted (11 from four engine
      # commits, 1 a fingerprint that never matched any real content) while this
      # job stayed green, because nothing ever ran it outside a manual invocation.
      #
      # A source change under a fingerprinted module makes this fail until the same
      # commit refreshes the stored hash. `normify_module_refresh` recomputes it for
      # one module (`ids: [...]`) or all of them; `normify_sync` is the read-only
      # planner that lists which modules are stale. CI must not refresh on its own:
      # writing the model here would hide the very drift the step exists to report.
      - run: bun run check:normify
      # Intra-crate module graph of the Rust engine, which neither gate above can
      # see: `architecture.json` has one entry for the whole crate and its Check B
      # reads `IMPORT_EXTENSIONS`, which does not include `.rs`; normify's tree has
      # 37 `kimi-code.engine.*` concepts and 15 conceptual edges against 248 real
      # `crate::` pairs. Two-way ratchet over scripts/rust-module-deps-baseline.json:
      # a new cross-module dependency fails (and prints its evidence sites), and so
      # does a recorded one that is gone, so the record cannot rot. Re-record with
      # `bun run check:rust-module-deps:update` in the same commit as the change.
      - run: bun scripts/check-rust-module-deps.mjs
      # Ledger gate (packages/kimi-agent/ROADMAP.md): every file and test the
      # divergence ledger cites must still exist. The ledger is the fork's only
      # record of what the Rust port did and did not take from the deleted
      # TypeScript engine, so a citation to a deleted file or a renamed test
      # makes it a source of wrong conclusions — see ROADMAP §6.17.2. Line
      # numbers are intentionally not checked; see the script header.
      - run: bun scripts/check-roadmap-refs.mjs
      # Fetch upstream once: the parity cross-check and the retired-package delta
      # ratchet both read it. Best-effort so an unreachable upstream cannot break
      # the build, but each gate surfaces the skip instead of passing quietly.
      - name: Fetch upstream for the parity cross-checks
        run: |
          git remote add upstream https://github.com/MoonshotAI/kimi-code.git 2>/dev/null || true
          git fetch --no-tags upstream main
        continue-on-error: true
      # Rust engine <-> TS interface parity: REST endpoints, WS events, tool
      # names and napi exports must agree across the two sides. The v3 snapshot
      # is also re-checked against upstream's own schemas through the ref fetched
      # above, so a hand-transcribed mirror cannot rot unnoticed.
      - run: bun scripts/scan-parity.mjs
      # No-comment policy for packages/transcript (see the root AGENTS.md).
      - run: bun scripts/check-no-comments.mjs
      # Every t() call must resolve to a locale key.
      - run: bun scripts/check-t-call-coverage.mjs
      # Every engine.* locale key must be used by some LocalizedText (an orphan
      # means the catalog carries a sentence no call site can reach), every key a
      # LocalizedText names must exist in the embedded en catalog (a miss would
      # render as a bare key in the user's transcript), and every with_params
      # site must bind exactly the {{placeholders}} its en template declares (a
      # mismatch would render a literal {{name}}).
      - run: bun scripts/check-engine-i18n-parity.mjs
      # Hardcoded user-facing strings that duplicate an existing locale value.
      - run: bun scripts/scan-hardcoded-v2.mjs
      # Hardcoded prose in the Rust engine, which scan-hardcoded-v2 does not
      # cover at all — it scans six TypeScript trees and packages/kimi-agent is
      # 21.8万行 with none. A two-way ratchet: a new unrecorded literal fails,
      # and so does a recorded one that has been localized or deleted, so the
      # record cannot rot.
      - run: bun scripts/scan-hardcoded-rust.mjs
      # Retired-package delta ratchet: this fork deleted packages/agent-core-v2,
      # kap-server, klient and acp-server, so upstream commits touching them merge
      # silently and their behavior is never ported. Every such commit since the
      # merge base must carry a recorded verdict (ported / tracked /
      # not-applicable) in scripts/upstream-v2-delta-allowlist.json.
      #
      # Run the script directly: it already exits 2 with an explanation when the
      # ref cannot be resolved. The previous `if rev-parse upstream/main` wrapper
      # downgraded that to a `::warning::` and passed, which defeated the tool's
      # whole contract ("fails loudly when the ref is unavailable rather than
      # passing silently") — an unavailable upstream is indistinguishable from
      # having no upstream deltas at all. The fetch above is not best-effort
      # either (only the `remote add` is guarded), so a network failure already
      # fails this job one step earlier; the wrapper bought no stability, only a
      # blind spot.
      - name: Check retired-package upstream delta
        run: bun scripts/check-upstream-v2-delta.mjs
      # Locale consistency: en/zh key parity, placeholder validity, and JSON
      # freshness (regenerate, then fail if tracked JSON drifted from the TS sources).
      - run: bun scripts/check-locale-keys.mjs
      # Orphan locale keys, catalog-wide. `check-engine-i18n-parity.mjs` refuses an
      # unused `engine.*` key, but the engine only ever names `engine.*` — the rest
      # of the embedded catalog is reached by the *host* through the napi
      # `translate` binding, so an engine-only rule is blind to most of it. This
      # scans both consumers and ratchets: a newly unreachable key fails, and so
      # does a recorded one that has become reachable again.
      - run: bun scripts/check-locale-orphans.mjs
      - run: bun scripts/check-locale-placeholders.cjs
      - run: bun scripts/generate-locale-json.cjs && git diff --exit-code -- '**/locales/*.json'

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - name: Typecheck
        # `tsgo` comes from the root `@typescript/native-preview` devDependency,
        # the same binary the per-package `typecheck` scripts use, so local and
        # CI run an identical toolchain.
        run: |
          bunx --bun tsgo --version
          for config in packages/*/tsconfig.json apps/kimi-code/tsconfig.json; do
            echo "Typechecking ${config}"
            bunx --bun tsgo -p "${config}" --noEmit
          done
      - name: Typecheck VS Code extension
        run: cd apps/vscode && bun --bun run typecheck
      - name: Typecheck vis-server
        run: cd apps/vis/server && bun --bun run typecheck
      - name: Typecheck vis-web
        run: cd apps/vis/web && bun --bun run typecheck
