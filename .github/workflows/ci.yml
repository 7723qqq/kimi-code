name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Smoke test CLI bundle
        run: cd apps/kimi-code && bun run smoke

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      - name: Install Rust toolchain (kimi-native-tools)
        uses: dtolnay/rust-toolchain@stable

      - name: Build kimi-native-tools
        run: cd packages/kimi-native-tools && bun run build

      # The vitest suite runs under the Bun runtime (`--bun`): Bun is the
      # canonical dev/test toolchain and the shards need no Node install.
      - run: bun --bun run test --shard=${{ matrix.shard }}/5

  # The Rust engine has its own cargo suite (unit tests plus the stdio-RPC
  # integration tests). It is not part of the vitest workspace, so without this
  # job nothing in CI ever runs it.
  #
  # Windows stays in the matrix on purpose: the native-Bash path shells out to
  # Git Bash and is Windows-sensitive, and the deadlock this job was written to
  # catch (a child inheriting the engine's RPC stdin) only reproduced there.
  test-rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/kimi-agent/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/kimi-agent/Cargo.lock') }}

      # `--features cli` is what builds the `kimi-agent-cli` binary the
      # integration tests spawn. It sits behind `required-features`, so a bare
      # `cargo test` leaves a stale artifact in place — or none at all.
      - name: Test Rust engine
        working-directory: packages/kimi-agent
        run: cargo test --features cli

      # The integration tests skip — and therefore pass — when that binary is
      # missing, which would turn this job green while it tested nothing.
      - name: Assert the CLI binary was built
        working-directory: packages/kimi-agent
        shell: bash
        run: |
          ls target/debug/kimi-agent-cli target/debug/kimi-agent-cli.exe 2>/dev/null \
            || { echo "::error::kimi-agent-cli missing; integration tests would silently skip"; exit 1; }

  # pi-tui's suite runs on node:test (not vitest), so the root `bun run test`
  # does not execute it; it needs its own job.
  test-pi-tui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - run: cd packages/pi-tui && bun --bun run test

  test-windows:
    runs-on: windows-latest
    # Temporarily disabled while Windows tests are being stabilized.
    if: false

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # Same Bun-runtime note as the sharded test job.
      - run: bun install --frozen-lockfile
      # Windows runners are slower and run the whole suite (including
      # in-process e2e tests) under more contention, so the default 5s test
      # timeout causes flaky failures. Give it more headroom.
      - run: bun --bun run test -- --testTimeout=30000

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - run: bun --bun run lint
      - run: bun --bun run sherif
      # Locale consistency: en/zh key parity, placeholder validity, and JSON
      # freshness (regenerate, then fail if tracked JSON drifted from the TS sources).
      - run: bun scripts/check-locale-keys.mjs
      - run: bun scripts/check-locale-placeholders.cjs
      - run: bun scripts/generate-locale-json.cjs && git diff --exit-code -- '**/locales/*.json'

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: |
          bunx --bun --package @typescript/native-preview@beta tsgo --version
          for config in packages/*/tsconfig.json apps/kimi-code/tsconfig.json; do
            echo "Typechecking ${config}"
            bunx --bun --package @typescript/native-preview@beta tsgo -p "${config}" --noEmit
          done
      - name: Typecheck VS Code extension
        run: cd apps/vscode && bun --bun run typecheck
      - name: Typecheck vis-server
        run: cd apps/vis/server && bun --bun run typecheck
      - name: Typecheck vis-web
        run: cd apps/vis/web && bun --bun run typecheck
