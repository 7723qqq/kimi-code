name: Release

on:
  push:
    branches: ['release/*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  version:
    if: github.repository_owner == 'MoonshotAI' && startsWith(github.ref, 'refs/heads/release/')
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: changesets/action@v1
        id: version
        with:
          version: bun run version:release
          commit: 'ci: release packages'
          title: 'ci: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check version PR
        if: steps.version.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_BRANCH: changeset-release/${{ github.ref_name }}
        run: gh workflow run ci.yml --ref "$VERSION_BRANCH"

  candidate:
    if: github.repository_owner == 'MoonshotAI' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    outputs:
      publish: ${{ steps.trigger.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Wait for merged version commit CI
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-trigger.mjs

  vscode:
    needs: candidate
    if: needs.candidate.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/vscode-publish.yml
    secrets:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: candidate
    if: needs.candidate.outputs.publish == 'true'
    outputs:
      packages_published: ${{ steps.changesets.outputs.published }}
      # Dormant on this fork: the changesets and kimi-release steps below are
      # commented out, so these outputs are permanently empty and downstream
      # jobs gated on them never run.
      kimi_native_release: ${{ steps.kimi-release.outputs.should_publish }}
      kimi_release_tag: ${{ steps.kimi-release.outputs.tag }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Required for NPM Trusted Publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun (package manager)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # Upgrade npm for Trusted Publishing — only needed by the changesets
      # publish step below, which stays disabled on this fork.
      # - name: Upgrade npm for Trusted Publishing
      #   run: npm install -g npm@11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Kimi Code built-in catalog
        shell: bash
        run: |
          CATALOG_FILE="$RUNNER_TEMP/kimi-code-built-in-catalog.json"
          bun apps/kimi-code/scripts/update-catalog.mjs --out "$CATALOG_FILE"
          echo "KIMI_CODE_BUILT_IN_CATALOG_FILE=$CATALOG_FILE" >> "$GITHUB_ENV"

      - name: Build packages
        run: bun run build

      # Changesets action disabled: this fork follows upstream versions and
      # never publishes to npm independently. Re-enable when a standalone
      # release is needed.
      # - name: Create Release Pull Request or Publish to npm
      #   id: changesets
      #   uses: changesets/action@v1
      #   with:
      #     publish: bun run changeset publish
      #     version: bun run version:release
      #     commit: "ci: release packages"
      #     title: "ci: release packages"
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     # NPM_TOKEN is not needed with Trusted Publishing (OIDC)

      # - name: Resolve Kimi Code native release
      #   if: steps.changesets.outputs.published == 'true'
      #   id: kimi-release
      #   run: node apps/kimi-code/scripts/native/resolve-release.mjs
      #   env:
      #     CHANGESETS_PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}

  native-artifacts:
    name: Native release artifact
    needs: release
    if: needs.release.outputs.kimi_native_release == 'true'
    uses: ./.github/workflows/_native-build.yml
    with:
      upload-artifact-prefix: kimi-code-native
      retention-days: 7
      sign-macos: true
      sign-windows: true
    secrets:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  publish-native-assets:
    name: Publish native release assets
    needs:
      - release
      - native-artifacts
    if: needs.release.outputs.kimi_native_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun (package manager)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: kimi-code-native-*
          path: dist-native-release
          merge-multiple: true

      - name: Produce manifest.json
        env:
          RELEASE_TAG: ${{ needs.release.outputs.kimi_release_tag }}
        run: bun apps/kimi-code/scripts/native/produce-manifest.mjs dist-native-release "$RELEASE_TAG"

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.kimi_release_tag }}
        run: gh release upload "$RELEASE_TAG" dist-native-release/* --clobber

  deploy-docs:
    needs: publish-native-assets
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Deploy existing main documentation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs-deploy.yml --ref main
