name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-rust-bin:
    name: Build Rust CLI binaries
    uses: ./.github/workflows/_rust-bin-build.yml
    with:
      upload-artifact-prefix: kimi-rust-bin
      retention-days: 7
      sign-macos: true
    secrets:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}

  release:
    name: Release
    needs: build-rust-bin
    runs-on: ubuntu-latest
    outputs:
      packages_published: ${{ steps.changesets.outputs.published }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Required for NPM Trusted Publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Rust CLI binaries
        uses: actions/download-artifact@v8
        with:
          pattern: kimi-rust-bin-*
          path: "${{ runner.temp }}/rust-bin"
          merge-multiple: true

      - name: Inject Rust binaries into the npm shell packages
        run: |
          mkdir -p packages/kimi-code-rust-bin/bin apps/kimi-code/bin
          # Each artifact carries the platform binary (kimi-<target>[.exe]
          # + kimi-server-serve-<target>[.exe]); merge all platforms into
          # both shell packages' bin/ so their launchers find the right
          # binary at install.
          if [ -d "${{ runner.temp }}/rust-bin" ]; then
            cp -f "${{ runner.temp }}"/rust-bin/* packages/kimi-code-rust-bin/bin/ 2>/dev/null || true
            cp -f "${{ runner.temp }}"/rust-bin/* apps/kimi-code/bin/ 2>/dev/null || true
          fi
          ls -la packages/kimi-code-rust-bin/bin/ apps/kimi-code/bin/

      - name: Build packages
        run: pnpm build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm run version:release
          commit: "ci: release packages"
          title: "ci: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN is not needed with Trusted Publishing (OIDC)

  deploy-docs:
    name: Deploy docs
    needs: release
    if: needs.release.outputs.packages_published == 'true'
    uses: ./.github/workflows/docs-deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
