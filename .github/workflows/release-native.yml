name: Release Native

# Push a version tag (v2.1.1 or @moonshot-ai/kimi-code@2.1.1) to build the
# native deliverables on all six targets and publish them as a GitHub Release.
# This fork never publishes to npm, so the tag — not a changesets run — is the
# release trigger. _native-build.yml owns the per-target build, including
# signing and notarization when the Apple secrets are present.

on:
  push:
    tags:
      - 'v*'
      - '@moonshot-ai/kimi-code@*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v2.1.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: resolve
        env:
          # workflow_dispatch reads the input; push uses the tag that triggered
          # the run. `inputs` is empty on push, so both paths need one lookup.
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG:-$REF_NAME}"
          echo "Resolved tag: $tag"

          # Both tag forms carry the version: `@moonshot-ai/kimi-code@2.1.1`
          # and `v2.1.1`. Normalize before validating so the manifest and the
          # Release title agree on one spelling.
          version="${tag#@moonshot-ai/kimi-code@}"
          version="${version#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' does not carry a semver version (got '$version'). Expected vX.Y.Z or @moonshot-ai/kimi-code@X.Y.Z."
            exit 1
          fi

          # The tag drives every downstream step, but the checkout is still at
          # the branch tip on a push event, so verify the tag exists in this
          # clone and pin the build to the commit it points at.
          commit="$(git rev-list -n 1 "$tag")"
          echo "Tag '$tag' resolves to commit $commit"

          # A tag object existing locally is not enough: the Release the next
          # job creates is matched by commit, so confirm the tag is on the
          # remote before spending six build runners on it.
          if ! gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag '$tag' does not exist on $REPO. Push the tag first, or pass an existing tag."
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

  native:
    name: Native artifacts
    needs: resolve-release
    uses: ./.github/workflows/_native-build.yml
    with:
      upload-artifact-prefix: kimi-code-native-release
      retention-days: 3
      sign-macos: true
      sign-windows: true
    secrets:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  publish:
    name: Publish GitHub Release
    needs:
      - resolve-release
      - native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Build the Release from the tagged commit, not the branch tip.
          ref: ${{ needs.resolve-release.outputs.commit }}

      - name: Setup Bun (package manager)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: kimi-code-native-release-*
          path: dist-native-release
          merge-multiple: true

      - name: Produce manifest.json
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        # produce-manifest.mjs fails when any of the six targets is missing: a
        # partial manifest would strand clients on the absent platforms.
        run: bun apps/kimi-code/scripts/native/produce-manifest.mjs dist-native-release "$RELEASE_TAG"

      - name: Verify release assets
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail

          # The release guard below compares against the packaged binary, so a
          # mismatch means the tag was cut from a commit whose version was
          # never bumped — shipping that would mislabel every download.
          actual="$(bun -e 'console.log((await Bun.file("apps/kimi-code/package.json").json()).version)')"
          if [[ "$actual" != "$VERSION" ]]; then
            echo "::error::apps/kimi-code/package.json is at $actual but the tag says $VERSION. Bump the version before tagging."
            exit 1
          fi

          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            # Every published form is checked, not just the zip: the tar.gz and
            # zst are built here from the same binary but by separate tools, so
            # a checksum mismatch in either is possible and would reach users.
            for artifact in \
              "kimi-code-bun-${target}.zip" \
              "kimi-code-${target}.tar.gz" \
              "kimi-code-${target}.zst"; do
              if [[ ! -f "dist-native-release/$artifact" ]]; then
                echo "::error::Missing release asset $artifact"
                exit 1
              fi
              # Re-derive each checksum from the artifact itself. The .sha256
              # files travel in the same upload, so comparing them to each
              # other would prove nothing about the bytes users download.
              (cd dist-native-release && sha256sum -c "$artifact.sha256")
            done
          done

          # An empty or partial manifest would publish successfully and only
          # fail later, inside the client's self-update path.
          bun -e '
            const manifest = await Bun.file("dist-native-release/manifest.json").json();
            const targets = Object.keys(manifest.bun ?? {});
            if (targets.length !== 6) {
              console.error(`manifest.json carries ${targets.length} bun targets, expected 6`);
              process.exit(1);
            }
            console.log(`manifest.json ok: ${targets.sort().join(", ")}`);
          '

      - name: Extract changelog section
        id: changelog
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail

          # apps/kimi-code/CHANGELOG.md is written by changesets and released
          # without an entry, so a missing section must degrade to a generic
          # body rather than fail an otherwise complete release.
          notes="$(mktemp)"
          awk -v version="$VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' apps/kimi-code/CHANGELOG.md > "$notes"

          if [[ -s "$notes" ]]; then
            echo "Found CHANGELOG section for $VERSION"
          else
            echo "::warning::No CHANGELOG section for $VERSION; using a generic release body."
            {
              echo "Native release $VERSION."
              echo
              echo "See [the full changelog](https://github.com/${{ github.repository }}/blob/${{ needs.resolve-release.outputs.tag }}/apps/kimi-code/CHANGELOG.md) for details."
            } > "$notes"
          fi

          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
          NOTES: ${{ steps.changelog.outputs.path }}
          TARGET: ${{ needs.resolve-release.outputs.commit }}
        run: |
          set -euo pipefail

          # GitHub's API intermittently answers 5xx on writes while reads keep
          # working, and a failed release write would otherwise throw away six
          # completed builds.
          #
          # The retry decision must come from the HTTP status, not the exit
          # code: `gh` exits 1 for every API error regardless of status, so a
          # numeric test on `$?` would retry a 404 (tag missing, permission
          # denied) exactly like a 500 and waste 30s before giving up anyway.
          # Capturing the status also means the body survives for the error
          # message below, which `gh` alone would not give us.
          RELEASE_API="https://api.github.com/repos/$GITHUB_REPOSITORY/releases"

          # Prints the response body; leaves the status in HTTP_STATUS.
          HTTP_STATUS=''
          api() {
            local response
            response="$(curl --silent --show-error \
              --retry 0 \
              --write-out '\n%{http_code}' \
              --header "Authorization: token $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              "$@" 2>&1)" || true
            HTTP_STATUS="${response##*$'\n'}"
            printf '%s' "${response%$'\n'*}"
          }

          # Retry only 5xx and 429 — the failures that a later attempt can fix.
          # The body is written to a file rather than stdout so the status and
          # the payload stay reachable by the caller; returning them through a
          # command substitution would run this in a subshell and lose both.
          RETRY_BODY="$(mktemp)"
          # A caller that treats a 404 as "nothing to do" sets QUIET_404 and
          # still gets a non-zero return; without it the expected miss would
          # surface as a red error annotation on an otherwise green run.
          api_retry() {
            local attempt=1 delay=5
            : > "$RETRY_BODY"
            while true; do
              api "$@" > "$RETRY_BODY"
              if [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
                return 0
              fi
              if [[ "$HTTP_STATUS" != 5* && "$HTTP_STATUS" != 429 ]]; then
                if [[ "$HTTP_STATUS" != 404 || -z "${QUIET_404:-}" ]]; then
                  echo "::error::HTTP $HTTP_STATUS: $(cat "$RETRY_BODY")"
                fi
                return 1
              fi
              if [[ $attempt -ge 5 ]]; then
                echo "::error::still HTTP $HTTP_STATUS after $attempt attempts: $(cat "$RETRY_BODY")"
                return 1
              fi
              echo "::warning::attempt $attempt got HTTP $HTTP_STATUS; retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          # A Release for this tag may already exist: deleting a tag turns its
          # Release into a draft rather than removing it, and re-running this
          # workflow must not die on that leftover. Edit it when present so the
          # run is idempotent, and create it otherwise.
          release_id=""
          if QUIET_404=1 api_retry "$RELEASE_API/tags/$TAG"; then
            release_id="$(jq -r '.id // empty' < "$RETRY_BODY")"
          fi

          # jq builds the payload so the changelog body is escaped correctly;
          # hand-writing JSON around arbitrary markdown would break on quotes.
          payload="$(jq -n \
            --arg tag "$TAG" \
            --arg target "$TARGET" \
            --arg title "Kimi Code $VERSION" \
            --rawfile body "$NOTES" \
            '{tag_name: $tag, target_commitish: $target, name: $title, body: $body, draft: false}')"

          if [[ -n "$release_id" ]]; then
            echo "Updating existing release $release_id for $TAG"
            api_retry --request PATCH "$RELEASE_API/$release_id" --data "$payload" > /dev/null
          else
            echo "No release for $TAG yet; creating one"
            # The resolve job already proved the tag exists on the remote, so
            # naming it in the payload is enough; no --verify-tag equivalent
            # is needed here.
            api_retry --request POST "$RELEASE_API" --data "$payload" > /dev/null
          fi
          retry_upload() {
            local attempt=1 delay=5
            while true; do
              if gh release upload "$TAG" dist-native-release/* --clobber; then
                return 0
              fi
              if [[ $attempt -ge 5 ]]; then
                echo "::error::release upload failed after $attempt attempts"
                return 1
              fi
              echo "::warning::upload attempt $attempt failed; retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          retry_upload

          # A draft returns 404 from the by-tag endpoint, so verifying through
          # the listing is the only way to see one. `gh release upload` happily
          # uploads to a draft, and a draft is invisible to users, so a
          # successful upload alone does not mean the release is published.
          api_retry "$RELEASE_API?per_page=100"
          state="$(jq -r --arg tag "$TAG" \
            'map(select(.tag_name == $tag)) | first | if . == null then "missing" elif .draft then "draft" else "published" end' \
            < "$RETRY_BODY")"
          if [[ "$state" != "published" ]]; then
            echo "::error::Release $TAG is '$state' after upload, expected 'published'"
            exit 1
          fi

      - name: Summarize release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          {
            echo "### Native release $TAG"
            echo
            gh release view "$TAG" --json assets --jq '.assets[] | "- `\(.name)` (\(.size) bytes)"'
          } >> "$GITHUB_STEP_SUMMARY"
