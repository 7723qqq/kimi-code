packages:
  - packages/*
  # kimi-build is a Rust-only package (Cargo-managed deps, no package.json).
  - '!packages/kimi-build'
  - apps/*
  # kimi-web source lives outside this repo (prebuilt dist-web is committed
  # under apps/kimi-code/dist-web); only a stale node_modules dir remains.
  - '!apps/kimi-web'
  - apps/vis/server
  - apps/vis/web
  - docs

catalog:
  zod: 4.3.6
  pathe: ^2.0.3
  smol-toml: ^1.6.1
  jimp: ^1.6.1
  yazl: ^3.3.1
  ulid: ^3.0.1
  ws: ^8.18.0
  tsx: ^4.21.0

overrides:
  "kimi-code>@tailwindcss/vite": "4.1.18"
  "ssh2@1.17.0>cpu-features": "-"
  "ssh2@1.17.0>nan": "-"
  "kimi-code>tailwindcss": "4.1.18"
onlyBuiltDependencies:
  - esbuild
  - node-pty
  - protobufjs
  - simple-git-hooks
  - ssh2
