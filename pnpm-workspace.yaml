packages:
  - packages/*
  # kimi-build is a Rust-only package (Cargo-managed deps, no package.json).
  - '!packages/kimi-build'
  - apps/*
  # kimi-web is a fork-added Vue 3 web UI whose source lives and is tracked in
  # this repo (apps/kimi-web); it is deliberately excluded from the pnpm
  # workspace because it manages its own lockfile and is not built by the CLI.
  - '!apps/kimi-web'
  - apps/vis/server
  - apps/vis/web
  - docs

catalog:
  zod: 4.3.6
  pathe: ^2.0.3
  smol-toml: ^1.6.1
  jimp: ^1.6.1
  yazl: ^3.3.1
  ulid: ^3.0.1
  ws: ^8.18.0
  tsx: ^4.21.0

overrides:
  "@babel/core": ">=7.29.6"
  "@hono/node-server": ">=2.0.5"
  "body-parser": ">=2.3.0"
  "brace-expansion": ">=5.0.8"
  "diff": ">=8.0.3"
  "dompurify": ">=3.4.12"
  "esbuild": ">=0.28.1"
  "fast-uri": ">=3.1.1"
  "find-my-way": ">=9.7.0"
  "gray-matter>js-yaml": "^3.14.1"
  "hono": ">=4.12.18"
  "ip-address": ">=10.3.1"
  "js-yaml": ">=4.2.0"
  "kimi-code>@tailwindcss/vite": "4.1.18"
  "kimi-code>tailwindcss": "4.1.18"
  "linkify-it": ">=5.0.2"
  "mermaid": ">=11.16.1"
  "nanoid": ">=3.3.18"
  "postcss": ">=8.5.18"
  "protobufjs": ">=7.5.5"
  "qs": ">=6.15.2"
  "react-router": ">=7.15.1 <8.0.0"
  "serialize-javascript": ">=7.0.3"
  "shell-quote": ">=1.8.4"
  "ssh2@1.17.0>cpu-features": "-"
  "ssh2@1.17.0>nan": "-"
  "tar": ">=7.5.22"
  "undici": ">=7.28.0"
