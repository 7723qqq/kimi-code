[package]
name = "kimi-native-tools"
version = "0.1.0"
edition = "2021"
description = "Native Rust tools for Kimi Code — LLM SSE streaming"

[lib]
crate-type = ["cdylib"]
name = "kimi_native_tools"

[dependencies]
napi = { version = "2", features = ["async", "napi8", "serde"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "gzip"] }
futures-util = "0.3"
eventsource-stream = "0.2"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
