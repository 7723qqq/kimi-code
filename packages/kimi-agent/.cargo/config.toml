[http]
check-revoke = false

[net]
retry = 5

# macOS cdylib linking: NAPI symbols are provided by the host (Node/Bun)
# when the .node is loaded at runtime, so they must be allowed to stay
# undefined at link time.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-args=-Wl,-undefined,dynamic_lookup"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-args=-Wl,-undefined,dynamic_lookup"]
