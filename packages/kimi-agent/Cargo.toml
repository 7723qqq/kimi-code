[package]
name = "kimi-agent"
version = "0.1.0"
edition = "2024"
description = "Kimi Agent engine (Rust) — stateless turn loop, napi-rs native addon"

[lib]
crate-type = ["cdylib", "rlib"]
name = "kimi_agent"

# The CLI binary links the napi bindings statically and cannot resolve NAPI
# symbols outside a Node process, so it is excluded from default builds
# (`napi build` / asset packaging) and built explicitly with `--features cli`.
[[bin]]
name = "kimi-agent-cli"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["napi", "workflow-js"]
napi = ["dep:napi", "dep:napi-derive"]
# The CLI binary. Also pulls in the terminal-control dependency the REPL's
# interactive image preview needs, so a `--no-default-features --features cli`
# build (the pure-Rust one, used by CI's integration tests) still compiles it.
cli = ["dep:crossterm"]
# The Workflow tool's embedded JS engine (QuickJS via rquickjs). On by default
# so built-in workflow scripts run; `--no-default-features --features cli`
# yields a pure-Rust build with no C dependency, where `run` reports the engine
# is unavailable while `list`/`status`/`cancel` keep working.
workflow-js = ["dep:rquickjs"]

[dependencies]
napi = { version = "2", features = ["async", "tokio_rt", "napi8", "serde"], optional = true }
napi-derive = { version = "2", features = ["type-def"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fastrand = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "io-util", "io-std", "process", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "gzip", "json", "cookies"] }
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }
eventsource-stream = "0.2"
httparse = "1.10"
base64 = "0.22"
regex = "1"
sha2 = "0.10"
# Server bearer tokens are minted from the OS CSPRNG (src/server/auth.rs).
getrandom = "0.4"
# MCP OAuth credentials are encrypted at rest with the same algorithm v2 uses
# (AES-256-GCM, see src/mcp/oauth/crypto.rs).
aes-gcm = "0.10"
whoami = "1"
globset = "0.4"
ignore = "0.4"
once_cell = "1"
scraper = "0.22"
url = "2"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.8"
toml_edit = "0.22"

ulid = "1"
thiserror = "1.0"
encoding_rs = "0.8"
memchr = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ureq = { version = "2", features = ["json"] }
parking_lot = "0.12"
async-trait = "0.1"
dialoguer = "0.11"
# Terminal control for the standalone REPL's interactive image preview: raw-mode
# key reading, alternate screen, and cursor reporting. Feature-gated off by
# default so the napi addon and the library build never pull it in — the REPL
# is the only consumer and it is behind the `cli` feature.
crossterm = { version = "0.29", optional = true }
which = "6.0"
tower-lsp = "0.20"
lsp-types = "0.95"
rquickjs = { version = "0.9", features = ["full-async", "futures", "macro", "array-buffer"], optional = true }
portable-pty = "0.9"
# Plugin archives: a catalog `source` that is a GitHub repo or a zip URL is
# downloaded and extracted into the managed plugin root.
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
